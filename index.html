<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/RGBELoader.js"></script>
    
    <script>
        AFRAME.registerComponent('hdr-environment', {
            schema: { url: { type: 'string' } },
            init: function () {
                const scene = this.el.sceneEl.object3D;
                new THREE.RGBELoader().load(this.data.url, (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    scene.environment = texture; 
                });
            }
        });
    </script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        .mindar-ui-overlay, .mindar-ui-scanning, .mindar-ui-loading { display: none !important; }
        
        #ar-button {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; background: #000; color: white; border: none; 
            cursor: pointer; font-family: sans-serif; font-size: 16px;
        }
    </style>
</head>
<body>
    <button id="ar-button">POKRAČOVAT DO AR</button>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; uiLoading: no; filterMinCF: 0.0005; filterBeta: 0.001;" 
        hdr-environment="url: ./studio.hdr"
        loading-screen="enabled: false"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid1" src="1_str.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
            <video id="vid2" src="2_str.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
            <video id="vid3" src="3_str.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
            
            <a-asset-item id="kiwiModel" src="./kiwi.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane material="src: #vid1; shader: flat;" width="1" height="1.41" position="0 0 0" rotation="0 0 0"></a-plane>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
            <a-plane material="src: #vid2; shader: flat;" width="1" height="1.41" position="0 0 0" rotation="0 0 0"></a-plane>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2">
            <a-plane material="src: #vid3; shader: flat;" width="1" height="1.41" position="0 0 0" rotation="0 0 0"></a-plane>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3">
            <a-gltf-model 
                src="#kiwiModel" 
                position="0 0 0.15" 
                scale="0.005 0.005 0.005"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const v1 = document.getElementById('vid1');
        const v2 = document.getElementById('vid2');
        const v3 = document.getElementById('vid3');
        const button = document.getElementById('ar-button');
        const sceneEl = document.querySelector('a-scene');

        // Tlačítko inicializuje přehrávání všech videí (vyžadováno prohlížeči)
        button.addEventListener('click', () => {
            v1.play();
            v2.play();
            v3.play();
            button.style.display = 'none';
        });

        // Řízení spouštění konkrétního videa po detekci příslušného markeru
        sceneEl.addEventListener("targetFound", event => {
            const index = event.detail.targetIndex;
            if (index === 0) v1.play();
            if (index === 1) v2.play();
            if (index === 2) v3.play();
        });

        // Zastavení videa při ztrátě markeru z dohledu kamery
        sceneEl.addEventListener("targetLost", event => {
            const index = event.detail.targetIndex;
            if (index === 0) v1.pause();
            if (index === 1) v2.pause();
            if (index === 2) v3.pause();
        });
    </script>
</body>
</html>
